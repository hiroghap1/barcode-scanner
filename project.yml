# XcodeGen プロジェクト定義
# 変更後は `xcodegen generate` で BarcodeAssign.xcodeproj を再生成する
name: BarcodeAssign
options:
  bundleIdPrefix: jp.stellacreate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BarcodeAssignCore:
    path: BarcodeAssignCore

targets:
  BarcodeAssign:
    type: application
    platform: iOS
    sources:
      - BarcodeAssign
    dependencies:
      - package: BarcodeAssignCore
        product: BarcodeAssignCore
    info:
      path: BarcodeAssign/Info.plist
      properties:
        CFBundleDisplayName: ピッと登録
        CFBundleDevelopmentRegion: ja
        NSCameraUsageDescription: 商品のバーコードを読み取るためにカメラを使用します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CT7A5H25H6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BarcodeAssignUITests

  BarcodeAssignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BarcodeAssignUITests
    dependencies:
      - target: BarcodeAssign
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CT7A5H25H6
