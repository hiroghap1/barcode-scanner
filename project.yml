# XcodeGen プロジェクト定義
# 変更後は `xcodegen generate` で BarcodeAssign.xcodeproj を再生成する
name: BarcodeAssign
options:
  bundleIdPrefix: jp.stellacreate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BarcodeAssignCore:
    path: BarcodeAssignCore

targets:
  BarcodeAssign:
    type: application
    platform: iOS
    sources:
      - BarcodeAssign
    dependencies:
      - package: BarcodeAssignCore
        product: BarcodeAssignCore
    info:
      path: BarcodeAssign/Info.plist
      properties:
        CFBundleDisplayName: バーコード割当
        CFBundleDevelopmentRegion: ja
        NSCameraUsageDescription: 商品のバーコードを読み取るためにカメラを使用します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
